# HTTP остаётся доступным только для перенаправления на защищённый адрес.
server {
    listen 80;
    listen [::]:80;
    server_name app.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.local;

    # Эти файлы создаёт setup_app_local.sh с правами, ограничивающими доступ к ключу.
    ssl_certificate     /etc/nginx/ssl/app.local.crt;
    ssl_certificate_key /etc/nginx/ssl/app.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/app.local;
    index index.html;

    location / {
        # Отдаём только существующие файлы: неизвестные URL не маскируем как index.html.
        try_files $uri $uri/ =404;
    }
}
